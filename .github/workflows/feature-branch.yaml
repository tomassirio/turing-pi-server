name: Validate Helm Charts

on:
  pull_request:
    branches:
      - main
    paths:
      - 'services/**'
      - 'config/**'
      - '.github/workflows/**'

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      changed-services: ${{ steps.changes.outputs.services }}
      has-changes: ${{ steps.changes.outputs.has-changes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed services
        id: changes
        run: |
          CHANGED_FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }})

          echo "Changed files:"
          echo "$CHANGED_FILES"

          # Services with changed files, plus storage/secrets whenever config/ changes
          # (both are cheap to lint and a bad config/ edit can break every service).
          CHANGED_SERVICES=$(echo "$CHANGED_FILES" | grep "^services/" | cut -d'/' -f2 | grep -v "archived\|testing\|common" | sort -u)
          if echo "$CHANGED_FILES" | grep -q "^config/"; then
            CHANGED_SERVICES=$(printf '%s\nstorage\ncluster-secrets\n' "$CHANGED_SERVICES")
          fi
          CHANGED_SERVICES=$(echo "$CHANGED_SERVICES" | sort -u | jq -R -s -c 'split("\n") | map(select(length > 0))')

          echo "Changed: $CHANGED_SERVICES"

          if [ "$CHANGED_SERVICES" = "[]" ]; then
            echo "has-changes=false" >> $GITHUB_OUTPUT
          else
            echo "has-changes=true" >> $GITHUB_OUTPUT
          fi
          echo "services=$CHANGED_SERVICES" >> $GITHUB_OUTPUT

  validate:
    needs: detect-changes
    if: needs.detect-changes.outputs.has-changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.changed-services) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Install SOPS
        run: |
          SOPS_VERSION="3.9.0"
          curl -LO "https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.linux.amd64"
          sudo mv sops-v${SOPS_VERSION}.linux.amd64 /usr/local/bin/sops
          chmod +x /usr/local/bin/sops

      - name: Setup SOPS Age Key
        run: |
          mkdir -p ~/.config/sops/age
          echo "${{ secrets.SOPS_AGE_KEY }}" > ~/.config/sops/age/keys.txt
          chmod 600 ~/.config/sops/age/keys.txt
          echo "SOPS_AGE_KEY_FILE=$HOME/.config/sops/age/keys.txt" >> $GITHUB_ENV

      - name: Resolve chart path
        id: path
        run: |
          SERVICE="${{ matrix.service }}"
          if [ "$SERVICE" = "storage" ]; then
            echo "path=./config/storage" >> $GITHUB_OUTPUT
          elif [ "$SERVICE" = "cluster-secrets" ]; then
            echo "path=./config/secrets" >> $GITHUB_OUTPUT
          else
            echo "path=./services/$SERVICE" >> $GITHUB_OUTPUT
          fi

      - name: Update chart dependencies
        run: helm dependency update --skip-refresh "${{ steps.path.outputs.path }}"

      - name: Decrypt secrets if present
        id: secrets
        run: |
          SECRETS_FILE="${{ steps.path.outputs.path }}/secrets.yaml"
          if [ -f "$SECRETS_FILE" ]; then
            sops -d "$SECRETS_FILE" > "${{ steps.path.outputs.path }}/secrets.dec.yaml"
            echo "extra-values=-f ${{ steps.path.outputs.path }}/secrets.dec.yaml" >> $GITHUB_OUTPUT
          else
            echo "extra-values=" >> $GITHUB_OUTPUT
          fi

      - name: helm lint
        run: helm lint "${{ steps.path.outputs.path }}" -f ./config/global-values.yaml ${{ steps.secrets.outputs.extra-values }}

      - name: helm template (catch render errors)
        run: helm template "${{ matrix.service }}" "${{ steps.path.outputs.path }}" -f ./config/global-values.yaml ${{ steps.secrets.outputs.extra-values }} > /dev/null

      - name: Clean up decrypted secrets
        if: always()
        run: rm -f "${{ steps.path.outputs.path }}/secrets.dec.yaml"
