# NAS-hosted services aren't k3s workloads, so they have no pod selector for
# a normal Service to match - each gets a selector-less Service + a manual
# Endpoints pointing at the NAS IP:port, then an Ingress like any other
# in-cluster backend. Deploys to the "default" namespace (no override in
# config/namespace-overrides.txt) because that's where config/secrets'
# localhome-tls cert is created.
ingress:
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  tlsSecretName: localhome-tls

services:
  - name: jellyfin
    host: jellyfin.localhome.com
    ip: 192.168.2.150
    port: 8899
  - name: romm
    host: romm.localhome.com
    ip: 192.168.2.150
    port: 1759
    authGated: true
    # Gated behind Authentik (Proxy Provider, forward-auth single-application
    # mode). authentik's embedded outpost matches which app a check is for by
    # Host header, so auth-url must keep the real hostname (not the internal
    # Service DNS name) - a CoreDNS override (kube-system/coredns-custom)
    # resolves romm.localhome.com in-cluster to authentik-server's ClusterIP
    # so this still reaches the right pod without leaving the cluster.
    extraAnnotations:
      nginx.ingress.kubernetes.io/auth-url: "http://romm.localhome.com/outpost.goauthentik.io/auth/nginx"
      nginx.ingress.kubernetes.io/auth-signin: "https://romm.localhome.com/outpost.goauthentik.io/start?rd=$escaped_request_uri"
      nginx.ingress.kubernetes.io/auth-response-headers: "Set-Cookie"
  - name: immich
    host: immich.localhome.com
    ip: 192.168.2.150
    port: 8180
  - name: nas
    host: nas.localhome.com
    ip: 192.168.2.150
    port: 9443
    backendProtocol: HTTPS
