{{- range .Values.services }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}-nas
spec:
  ports:
    - port: {{ .port }}
      targetPort: {{ .port }}
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: {{ .name }}-nas
  labels:
    kubernetes.io/service-name: {{ .name }}-nas
addressType: IPv4
endpoints:
  - addresses:
      - {{ .ip }}
ports:
  - port: {{ .port }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .name }}-nas
  annotations:
    {{- range $key, $value := $.Values.ingress.annotations }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
    {{- if eq .backendProtocol "HTTPS" }}
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    nginx.ingress.kubernetes.io/proxy-ssl-verify: "false"
    {{- end }}
    {{- range $key, $value := .extraAnnotations }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
spec:
  ingressClassName: {{ $.Values.ingress.className }}
  tls:
    - secretName: {{ $.Values.ingress.tlsSecretName }}
      hosts:
        - {{ .host }}
  rules:
    - host: {{ .host }}
      http:
        paths:
          {{- if .authGated }}
          # authentik's forward-auth flow redirects the browser here directly
          # (not just the internal auth-check subrequest), so it has to be
          # routed to authentik itself rather than falling through to this
          # service's own catch-all "/" below.
          - path: /outpost.goauthentik.io
            pathType: Prefix
            backend:
              service:
                name: authentik-server
                port:
                  number: 80
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .name }}-nas
                port:
                  number: {{ .port }}
{{- end }}
