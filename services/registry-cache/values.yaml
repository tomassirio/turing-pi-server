# Each entry runs its own registry:2 in pull-through cache mode (proxy.remoteurl),
# since a single registry:2 instance can only proxy one upstream.
#
# Storage is emptyDir, not a PVC: this is disposable proxy cache data, not a
# source of truth -- an empty or lost cache just re-fetches from upstream on
# next pull. It was previously NFS-backed and a storage hiccup once left a
# corrupted zero-byte blob cached forever (registry:2 doesn't self-heal and
# has no automatic upstream fallback for a mirror that responds but serves
# bad data), which broke pod sandbox creation cluster-wide. Local emptyDir
# removes that failure mode entirely.
mirrors:
  - name: docker-hub
    remoteURL: https://registry-1.docker.io
    loadBalancerIP: 192.168.2.210
  - name: ghcr
    remoteURL: https://ghcr.io
    loadBalancerIP: 192.168.2.211
  - name: lscr
    remoteURL: https://lscr.io
    loadBalancerIP: 192.168.2.212

image:
  repository: registry
  tag: "2"
  pullPolicy: IfNotPresent

# ephemeral-storage limit doubles as the emptyDir cache's sizeLimit (see
# statefulset.yaml) -- this used to be a 20Gi/10Gi NFS PVC, so keep it
# generous or the cache starts thrashing/evicting way earlier than before.
resources:
  requests:
    cpu: 50m
    memory: 128Mi
    ephemeral-storage: 1Gi
  limits:
    cpu: 500m
    memory: 512Mi
    ephemeral-storage: 20Gi
