apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "grafana.fullname" . }}-datasources
  labels:
    {{- include "grafana.labels" . | nindent 4 }}
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        # Pinned to the uid grafana.db already has, which dashboards/*.json reference.
        uid: PBFA97CFB590B2093
        type: prometheus
        url: http://prometheus:9090
        access: proxy
        isDefault: true
