replicaCount: 1

image:
  repository: grafana/grafana
  pullPolicy: IfNotPresent
  tag: "10.2.0"

imagePullSecrets: []
  # - name: regcred
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

persistence:
  enabled: true
  existingClaim: nas-config-pvc
  subPath: grafana
  storageClassName: ""
  accessModes:
    - ReadWriteMany
  size: 10Gi
  # existingClaim: "my-existing-claim"
  config:
    enabled: true
    existingClaim: nas-config-pvc
    subPath: grafana-config
  restore:
    enabled: true
    existingClaim: observability-config-pvc
    mountPath: /restore-source
    readOnly: true
  backup:
    enabled: true
    existingClaim: observability-config-pvc
    mountPath: /backup-dest
    readOnly: false

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/service-upstream: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: grafana.localhome.com
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - secretName: localhome-tls
      hosts:
        - grafana.localhome.com
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# Grafana settings as GF_* environment variables.
env:
  # Links Grafana builds (share links, public dashboard URLs) use this instead of http://localhost:3000.
  GF_SERVER_ROOT_URL: https://grafana.localhome.com

# Public dashboards on the internet, nothing else: an Ingress on the internet-facing controller
# (services/ingress-nginx-public, 192.168.2.203 - the router's WAN 443 target) that routes only the
# paths a public dashboard needs. The login page, the API and every private dashboard 404 there.
# DNS: a CNAME for the host to tomassirio.myddns.me (DNS only, like jellyfin.tomassir.io).
publicIngress:
  enabled: true
  host: stats.tomassir.io
  className: nginx-public
  issuer: letsencrypt
  tlsSecretName: stats-tomassir-io-tls
  # Where "/" sends visitors: a public dashboard's URL (Share > Public dashboard in Grafana).
  home: /public-dashboards/a84eece3913d4bf7bff4f4c14d50b25e
  paths:
    - /public-dashboards/  # the page
    - /api/public/         # its queries and annotations (token-scoped)
    - /public/             # Grafana's scripts, styles, fonts, images
  # The page also POSTs its load timings to /api/frontend-metrics, which Grafana only takes from signed-in users
  # (an "Unauthorized" toast every minute for visitors). On this host a tiny nginx answers it with 204 instead.
  sink:
    image: nginx:1.27-alpine
    paths:
      - /api/frontend-metrics

resources:
  requests:
    ephemeral-storage: 256Mi
  limits:
    ephemeral-storage: 1Gi

# This is to setup the liveness and readiness probes
livenessProbe:
  httpGet:
    path: /api/health
    port: 3000
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /api/health
    port: 3000
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}