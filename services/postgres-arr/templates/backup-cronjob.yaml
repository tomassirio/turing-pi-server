apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-backup
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: pg-dump
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  f=/backup/{{ .Release.Name }}-$(date +%Y%m%d-%H%M).sql.gz
                  pg_dumpall -h {{ .Release.Name }} -U {{ .Values.user }} | gzip > "$f.tmp"
                  mv "$f.tmp" "$f"
                  ls -1t /backup/{{ .Release.Name }}-*.sql.gz | tail -n +{{ add1 .Values.backup.keep }} | xargs -r rm -f
                  echo "✅ $(ls -lh "$f")"
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Release.Name }}
                      key: POSTGRES_PASSWORD
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              volumeMounts:
                - name: backup
                  mountPath: /backup
                  subPath: {{ .Values.backup.subPath }}
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: {{ .Values.backup.existingClaim }}
