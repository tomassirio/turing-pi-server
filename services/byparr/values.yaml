replicaCount: 1

image:
  repository: ghcr.io/thephaseless/byparr
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []
  # - name: regcred

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80

webuiPort: 8191

ingress:
  enabled: true
  className: nginx
  host: byparr.localhome.com
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/service-upstream: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  tls:
    - secretName: localhome-tls
      hosts:
        - byparr.localhome.com

env:
  LOG_LEVEL: "info"
  TZ: "Europe/Amsterdam"
  # Egress via gluetun's HTTP proxy (qbittorrent Service) so ISP-blocked sites can be solved
  PROXY_SERVER: "http://qbittorrent:8888"

resources:
  limits:
    cpu: 2000m
    memory: 1Gi
    ephemeral-storage: 2Gi
  requests:
    cpu: 100m
    memory: 256Mi
    ephemeral-storage: 1Gi

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
livenessProbe:
  httpGet:
    path: /
    port: 8191
  initialDelaySeconds: 30
  periodSeconds: 10
  # Solving a challenge blocks the server; outlast the 120s requestTimeout set on the Prowlarr proxy
  timeoutSeconds: 10
  failureThreshold: 18
readinessProbe:
  httpGet:
    path: /
    port: 8191
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

# Image is ~1GB+ (Chromium); other nodes' small disks hit DiskPressure pulling it
nodeSelector:
  kubernetes.io/hostname: turing-03

tolerations: []

affinity: {}
