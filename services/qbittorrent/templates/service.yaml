apiVersion: v1
kind: Service
metadata:
  name: {{ include "qbittorrent.fullname" . }}
  labels:
    app: {{ include "qbittorrent.name" . }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - protocol: TCP
      name: "web-ui"
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.webuiPort }}
    - protocol: TCP
      name: "torrent-port"
      port: {{ .Values.torrentPort }}
      targetPort: {{ .Values.torrentPort }}
    {{- if .Values.vpn.enabled }}
    - protocol: TCP
      name: "gluetun-health"
      port: {{ .Values.vpn.healthPort }}
      targetPort: {{ .Values.vpn.healthPort }}
    - protocol: TCP
      name: "gluetun-http-proxy"
      port: {{ .Values.vpn.httpProxyPort }}
      targetPort: {{ .Values.vpn.httpProxyPort }}
    {{- end }}
  selector:
    app: {{ include "qbittorrent.name" . }}
