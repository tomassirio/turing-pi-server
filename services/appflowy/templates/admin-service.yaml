apiVersion: v1
kind: Service
metadata:
  name: {{ include "appflowy.fullname" . }}-admin
  labels:
    {{- include "appflowy.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
  selector:
    app: {{ include "appflowy.name" . }}-admin
