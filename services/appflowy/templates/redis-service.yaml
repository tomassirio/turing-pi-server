apiVersion: v1
kind: Service
metadata:
  name: {{ include "appflowy.fullname" . }}-redis
  labels:
    {{- include "appflowy.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app: {{ include "appflowy.name" . }}-redis
