apiVersion: v1
kind: Service
metadata:
  name: {{ include "appflowy.fullname" . }}-web
  labels:
    {{- include "appflowy.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: {{ include "appflowy.name" . }}-web
