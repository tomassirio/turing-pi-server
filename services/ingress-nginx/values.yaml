# Thin wrapper around the upstream ingress-nginx chart (kubernetes.github.io/ingress-nginx).
# Values are nested under `ingress-nginx:` because that's the dependency name in Chart.yaml.
#
# Single replica meant the whole network's ingress went down if that one pod's node died.
# MetalLB (config/metallb-config.yaml, L2 mode) already fails the VIP over between nodes,
# but that only helps if a controller pod is still alive somewhere to receive it - so spread
# 3 replicas one-per-node via anti-affinity, surviving any single node loss.
ingress-nginx:
  controller:
    replicaCount: 3
    # Avoid transient 404s: a new/rolling pod passes its readiness probe before it has
    # synced every Ingress object from the API server, and the Service will route to it
    # as soon as it's Ready. minReadySeconds gives it a buffer after Ready before the
    # rollout proceeds; maxUnavailable: 0 means a replica is never taken down for a
    # rolling update until its replacement is actually serving.
    minReadySeconds: 15
    updateStrategy:
      rollingUpdate:
        maxUnavailable: 0
        maxSurge: 1
      type: RollingUpdate
    # Keep 2 of 3 controllers alive during voluntary disruptions (node drain, etc.) so
    # metallb always has a healthy backend to fail over to. Chart creates the PDB
    # automatically whenever replicaCount > 1 - no separate enabled flag.
    minAvailable: 2
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/component
                  operator: In
                  values: [controller]
                - key: app.kubernetes.io/instance
                  operator: In
                  values: [ingress-nginx]
            topologyKey: kubernetes.io/hostname
