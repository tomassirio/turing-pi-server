# Dedicated cert for authentik.localhome.com, separate from the shared
# cluster-wide `localhome-tls` wildcard (config/secrets). That wildcard's CA
# has no keyUsage extension, which newer Python/OpenSSL (strict chain
# validation) rejects outright - breaking any client that validates the chain
# properly, e.g. Romm's OIDC metadata fetch. This CA was generated with the
# required extensions; scoped to authentik only so the shared wildcard (and
# every other service using it) is untouched.
apiVersion: v1
kind: Secret
metadata:
  name: authentik-tls
type: kubernetes.io/tls
data:
  tls.crt: {{ .Values.ingressTls.crt | b64enc }}
  tls.key: {{ .Values.ingressTls.key | b64enc }}
