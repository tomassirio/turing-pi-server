# Configarr Helm Chart Values

nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/raydak-labs/configarr
  tag: latest
  pullPolicy: IfNotPresent

# CronJob schedule (default: every hour)
schedule: "0 * * * *"
trigger: pipelines

# Job history limits
successfulJobsHistoryLimit: 1
failedJobsHistoryLimit: 1

restartPolicy: Never

# Environment variables
env:
  TZ: "Europe/Amsterdam"

resources:
  requests:
    ephemeral-storage: 128Mi
  limits:
    ephemeral-storage: 512Mi

# Persistence configuration
persistence:
  repos:
    # Repository cache storage
    existingClaim: configs-config-pvc
    subPath: configarr-repos

# Configuration for *arr services
# API keys are stored in secrets.yaml (encrypted with SOPS)
config:
  # Sonarr configuration
  sonarr:
    enabled: true
    baseUrl: "http://sonarr.default.svc.cluster.local:80"
    # TRaSH-Guides quality profiles by trash_id (docs/json/sonarr/quality-profiles)
    templates:
      - template: 72dae194fc92bf828f32cde7744e51a1 # WEB-1080p
        source: TRASH
      - template: 20e0fc959f1f1704bed501f23bdae76f # [Anime] Remux-1080p
        source: TRASH

  # Radarr configuration
  radarr:
    enabled: true
    baseUrl: "http://radarr.default.svc.cluster.local:80"
    # TRaSH-Guides quality profiles by trash_id (docs/json/radarr/quality-profiles)
    templates:
      - template: d1d67249d3890e49bc12e275d989a7e9 # HD Bluray + WEB
        source: TRASH

  # Lidarr configuration
  # TRaSH-Guides has no Lidarr profiles yet, nothing to sync
  lidarr:
    enabled: false
    baseUrl: "http://lidarr.default.svc.cluster.local:80"
    templates: []
