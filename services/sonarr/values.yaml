# Default values for sonarr.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

image:
  repository: linuxserver/sonarr
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

webuiPort: 8989

persistence:
  data:
    enabled: true
    existingClaim: nas-pvc
  config:
    enabled: true
    type: emptyDir
    existingClaim: nas-config-pvc
    subPath: sonarr
  restore:
    enabled: true
    existingClaim: nas-config-pvc
    mountPath: /restore-source
    readOnly: true
  backup:
    enabled: true
    existingClaim: nas-config-pvc
    mountPath: /backup-dest
    readOnly: false

ingress:
  enabled: true
  className: nginx
  host: sonarr.localhome.com
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/service-upstream: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  tls: []

env:
  PUID: "911"
  PGID: "911"
  TZ: "Europe/Amsterdam"

# DB lives in services/postgres-arr (turing-03's SSD) instead of SQLite in the
# emptyDir /config, where every write took ~10s on the SD card. /config still
# holds config.xml etc. and keeps the NAS restore/backup.
postgres:
  enabled: true
  host: postgres-arr
  user: arr
  secretName: postgres-arr

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
  # - name: regcred
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9794"
  prometheus.io/path: "/metrics"
  # exportarr pages through /queue (~10 items/page, ~10s per page here): with
  # a 473-item queue one scrape measured 102s. Timeout must stay below the
  # interval, and the interval under Prometheus's 5m staleness window.
  # ponytail: fails again past ~800 queued episodes; no exportarr knob for page size.
  prometheus.io/scrape-interval: "3m"
  prometheus.io/scrape-timeout: "170s"

additionalContainers:
  - name: exportarr
    image: ghcr.io/onedr0p/exportarr:latest
    imagePullPolicy: IfNotPresent
    args: ["sonarr"]
    securityContext:
      runAsUser: 911
      runAsGroup: 911
    env:
      - name: PORT
        value: "9794"
      - name: URL
        value: "http://localhost:8989"
      - name: CONFIG
        value: "/config/config.xml"
      # No ENABLE_ADDITIONAL_METRICS: it fans out /episode + /episodefile per
      # series on every scrape (~216 calls for 108 series). Scrapes ran past
      # 30s, overlapped, and kept sonarr pegged at ~1.4 cores. Only the
      # episode-quality metric needed it.
    ports:
      - name: metrics
        containerPort: 9794
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
        ephemeral-storage: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
        ephemeral-storage: 256Mi
    volumeMounts:
      - name: config
        mountPath: /config
        readOnly: true

podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

resources:
  requests:
    cpu: 500m
    memory: 1Gi
    ephemeral-storage: 256Mi
  limits:
    cpu: "4"
    # RSS sync / indexer search across 55+ series parses large release batches
    # in memory (same burst that forced the CPU limit up below) -- 1Gi got
    # OOMKilled mid-sync. Bumped with headroom; revisit if it still OOMs.
    # Activity screen with ~1000 history entries loads the whole history into
    # memory client-side too -- 2Gi wasn't enough headroom, bumped further.
    memory: 3Gi
    ephemeral-storage: 1Gi

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
# timeoutSeconds/failureThreshold widened past defaults: RSS sync bursts
# (1000+ releases) CPU-throttle the container hard enough that /ping can
# miss a tight 5s window even when sonarr itself is fine -- see cpu.stat
# nr_throttled evidence, cpu limit raised above to reduce how often this
# throttling happens at all.
livenessProbe:
  httpGet:
    path: /ping
    port: 8989
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 10
  failureThreshold: 5
readinessProbe:
  httpGet:
    path: /ping
    port: 8989
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 10
  failureThreshold: 5

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}
